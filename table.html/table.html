<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2>Spanning rows using the rowspan attribute</h2>
    <table border="1" width="300" height="280">
        <tr>
            <td bgcolor="gray"></td>
            <td bgcolor="green"></td>
            <td bgcolor="red" rowspan="3"></td>
        </tr>
        <tr>
            <td bgcolor="gray"></td>
            <td bgcolor="yellow" rowspan="2"></td>
        </tr>
        <tr>
            <td bgcolor="gray"></td>
        </tr>
    </table>
</body>
</html>
